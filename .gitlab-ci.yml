variables:
  # Docker Variables
  hostname: "nexus.holydev.net"
  maintainer: "holt31"
  dockerimagename: "nmrih-server"
  dockersubfolder: "."
  version: "latest"
  kubeuser: "root"
  kubemaster: "10.0.1.3"

stages:
  - build_docker
  - restart_pods
  - get_logs
  - describe_pods

.before_script_build_docker:
  before_script:
    # Sometimes Dind svc seems too long to start and/or dind certs are long to be available on builder
    - mkdir -p /kaniko/.docker
    - echo $DOCKER_AUTH_CONFIG > /kaniko/.docker/config.json

build_docker_nmrih:
  extends: .before_script_build_docker
  stage: build_docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""] 
  # Build Docker-Image
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "$hostname/$maintainer/$dockerimagename:$version"

  only:
    refs:
      - master

restart_nmrih_pod:
  stage: restart_pods
  when: manual
  variables:
    GIT_STRATEGY: none
  script:
    - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh -p22 $kubeuser@$kubemaster '/usr/bin/kubectl delete pod -n web $(/usr/bin/kubectl get pod -n web | grep nmrih | awk '\''{print $1}'\'')'
    - echo -e "Host *\n\tStrictHostKeyChecking yes\n\n" > ~/.ssh/config
  only:
    refs:
      - master

get_nmrih_logs:
  stage: get_logs
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh -p22 $kubeuser@$kubemaster '/usr/bin/kubectl logs -n web $(/usr/bin/kubectl get pod -n web | grep nmrih | awk '\''{print $1}'\'')'
    - echo -e "Host *\n\tStrictHostKeyChecking yes\n\n" > ~/.ssh/config
  only:
    refs:
      - master

describe_nmrih_pods:
  stage: describe_pods
  when: manual
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh -p22 $kubeuser@$kubemaster '/usr/bin/kubectl describe pod -n web $(/usr/bin/kubectl get pod -n web | grep nmrih | awk '\''{print $1}'\'')'
    - echo -e "Host *\n\tStrictHostKeyChecking yes\n\n" > ~/.ssh/config
  only:
    refs:
      - master