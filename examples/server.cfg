// ##################################
// ############# NMRIH  #############
// ######## Dedicated Server ########
// ###### server.cfg template #######
// ##################################
//
// Copy this file to /home/nmrih/server/nmrih/cfg/server.cfg and adjust it to your needs.
// The file is executed on every map start, after the start parameters of the server.
// If you are not sure about a setting, you can check it in the server console with: help <name>

// Server name, shown in the server browser
hostname "My No More Room in Hell Server"

// Passwords
// Don't set sv_password or rcon_password in this file!
// Use the secrets or the variables NMRIH_PW and NMRIH_RCONPW instead.
// Otherwise this file overrides the passwords from the secrets or the variables.

// Network
// 0 = Internet server, 1 = LAN only
sv_lan 0
// sv_region is set via the variable NMRIH_REGION

// Game settings
// Difficulty: casual, classic or nightmare
sv_difficulty "classic"
// 1 = zombies only die from headshots with firearms (melee is not affected)
sv_realism 0
// 1 = hides the wave count, the zombie count and the zone health on the HUD
sv_hardcore_survival 0

// Optional game settings (please check them with "help <name>" before you use them)
// 1 = players can hurt each other
// mp_friendlyfire 1
// Damage multiplier for friendly fire
// sv_friendly_fire_factor 1
// Respawn time in seconds for players without a respawn token
// sv_respawn_time_notoken 30

// Downloads of custom content (maps, sounds etc.) for the clients
sv_allowdownload 1
sv_allowupload 1
// Optional fast download server
// sv_downloadurl "https://example.com/nmrih/"

// Voice chat
sv_voiceenable 1

// Protection against brute force attacks on RCON
// Ban time in minutes after too many failed logins
sv_rcon_banpenalty 30
sv_rcon_maxfailures 5
sv_rcon_minfailures 5
sv_rcon_minfailuretime 30

// Logging (the logs are stored in /home/nmrih/server/nmrih/logs)
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
sv_log_onefile 0

// Load the banned players and IP addresses
exec banned_user.cfg
exec banned_ip.cfg
